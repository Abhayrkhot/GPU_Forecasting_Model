name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: CLI smoke test (packaged bundle)
        run: |
          gpufc models
          gpufc explain --model qwen3-14b --gpu l40s --decode 64 --context 2048
          gpufc predict --model qwen3-8b --gpu a100-80g --rate 4 --requests 300
          gpufc plan --model qwen2.5-14b --rate 20 --gpus h200,a100-80g,a6000 --requests 300
      - name: Packaged bundle and README reproduce from results/
        run: |
          python scripts/check_bundle.py
          python scripts/build_readme.py --check
